name: Gather recordings

# Finds and checks public-domain recordings for Listen on Wikimedia Commons (music, and people's own voices).
# Runs when tools/listen/request.json changes on a branch (or by hand). See tools/listen/gather.py.
# Only the facts about each recording are committed; the phone streams the sound from Wikimedia.
on:
  push:
    branches-ignore: [main]
    paths: [tools/listen/request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather-listen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffprobe (checks every MP3 really plays)
        run: command -v ffprobe || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
      - run: python3 tools/listen/gather.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in tools/listen/out online/listen; do [ -e "$f" ] && git add -A "$f"; done
          git commit -qm "Gather recordings: $(grep -o '"mode": *"[a-z]*"' tools/listen/request.json)" || { echo "Nothing new"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
