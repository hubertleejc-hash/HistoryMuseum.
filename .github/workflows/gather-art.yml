name: Gather art

# Downloads public-domain (CC0) artworks from museums' open-access APIs and commits them.
# The cloud dev machine can't reach the museums, so GitHub does the fetching.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/art/**', '.github/workflows/gather-art.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: bash tools/art/probe.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A tools/art
          git commit -m "Art probe results [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
