name: Today dates

# Looks up the exact birth and death days of the museum's people on Wikidata (CC0) for the
# "Today in history" page, and commits app/today.js to the branch it runs on. Manual only;
# re-run it after new people are added to app/data.js.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/today/dates.py
      - name: Commit the dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/today.js
          git commit -qm "Today dates: exact birth and death days from Wikidata" || { echo "Nothing new"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
