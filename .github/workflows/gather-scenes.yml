name: Gather street scenes

# Finds and downloads real public-domain period pictures for the Walk-in scenes.
# Runs when tools/scenes/request.json changes on a branch (or by hand). See tools/scenes/scenes.py.
on:
  push:
    branches-ignore: [main]
    paths: [tools/scenes/request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather-scenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.3.0
      - name: Depth model tools (fetch only)
        if: ${{ hashFiles('tools/scenes/request.json') != '' }}
        run: |
          if grep -q '"picks"' tools/scenes/request.json; then
            pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install transformers==4.46.3
          fi
      - run: python3 tools/scenes/scenes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in tools/scenes/out app/img/scenes online/walks; do [ -e "$f" ] && git add -A "$f"; done
          git commit -qm "Gather street scenes: $(grep -o '"mode": *"[a-z]*"' tools/scenes/request.json)" || { echo "Nothing new"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
