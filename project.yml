# XcodeGen spec. GitHub builds the app from this (see .github/workflows).
# Before generating: python3 app/build.py  (writes ios/HistoryMuseum/Web/index.html)
name: HistoryMuseum
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HistoryMuseum:
    type: application
    platform: iOS
    sources:
      - path: ios/HistoryMuseum
    settings:
      base:
        PRODUCT_NAME: HistoryMuseum
        PRODUCT_BUNDLE_IDENTIFIER: com.hubert.contemporaries
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Contemporaries
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        # The iPhone Duo fold APIs (reserved regions) exist only in the iOS 27 SDK.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": "$(inherited) FOLD_APIS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": "$(inherited) FOLD_APIS"
schemes:
  HistoryMuseum:
    build:
      targets:
        HistoryMuseum: all
