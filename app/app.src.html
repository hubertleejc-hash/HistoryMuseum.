<title>Contemporaries</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Look: a museum at night (charcoal, parchment, antique gold, rust red);
   light mode reads like an old book. */
:root{
  --bg:#F7F3EA; --surface:#FFFDF8; --sunk:#EFE8DA; --ink:#1F1A14; --ink-2:#5A5043; --ink-3:#6E6252;
  --rule:#E4DCCB; --accent:#8A6420; --accent-ink:#FFFDF8; --accent-soft:rgba(138,100,32,.13); --band:rgba(138,100,32,.12);
  --gold:#8A6420; --shadow:0 10px 30px rgba(60,40,10,.10); --bar:rgba(255,253,248,.82);
  --land:#E6DCC8; --land-line:#CDBF9F; --lamp:#B8862B; --lamp-core:#5A3E0E; --lamp-ring:rgba(255,253,248,.95); --rust:#A33D1C; --rust-soft:rgba(163,61,28,.10);
  --lab-verified:#86651A; --lab-likely:#56703F; --lab-disputed:#A8641A; --lab-myth:#7A5A8C; --myth-tint:rgba(122,90,140,.09);
  --f-art:#A8445E; --f-music:#6A4E9C; --f-science:#2F6E8E; --f-writing:#9A6A1A; --f-leaders:#4C6B34;
  --f-philosophy:#7A5536; --f-exploration:#2B7A6E; --f-invention:#B4572A; --f-you:#86651A;
  --rel-warm:#A9532A; --rel-learn:#2F6E8E; --rel-rival:#A33D1C; --rel-met:#7A6E60;
  --glow:radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255,255,255,.9), transparent 70%);
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141312; --surface:#1C1B19; --sunk:#0F0E0D; --ink:#EDE3CF; --ink-2:#C4B89F; --ink-3:#958A76;
  --rule:#34312C; --accent:#D4AF5A; --accent-ink:#141312; --accent-soft:rgba(212,175,90,.15); --band:rgba(212,175,90,.13);
  --gold:#D4AF5A; --rust:#D66A43; --rust-soft:rgba(214,106,67,.13);
  --lab-verified:#D4AF5A; --lab-likely:#A9BC8C; --lab-disputed:#E3A35A; --lab-myth:#C6A6DA; --myth-tint:rgba(198,166,218,.08);
  --f-art:#E08AA0; --f-music:#B19AE0; --f-science:#6FB3D6; --f-writing:#E2BC62; --f-leaders:#9CC27F;
  --f-philosophy:#CFA57F; --f-exploration:#6CC9B8; --f-invention:#EE9562; --f-you:#D4AF5A;
  --rel-warm:#E69A6E; --rel-learn:#6FB3D6; --rel-rival:#E07A5A; --rel-met:#A49A88;
  --glow:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,175,90,.10), transparent 70%);
  --shadow:0 10px 30px rgba(0,0,0,.35); --bar:rgba(24,23,21,.78); --land:#26231F; --land-line:#3B372F; --lamp:#F2C969; --lamp-core:#FFE7A8; --lamp-ring:rgba(255,231,168,.9);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1C1B19; --sunk:#0F0E0D; --ink:#EDE3CF; --ink-2:#C4B89F; --ink-3:#958A76;
  --rule:#34312C; --accent:#D4AF5A; --accent-ink:#141312; --accent-soft:rgba(212,175,90,.15); --band:rgba(212,175,90,.13);
  --gold:#D4AF5A; --rust:#D66A43; --rust-soft:rgba(214,106,67,.13);
  --lab-verified:#D4AF5A; --lab-likely:#A9BC8C; --lab-disputed:#E3A35A; --lab-myth:#C6A6DA; --myth-tint:rgba(198,166,218,.08);
  --f-art:#E08AA0; --f-music:#B19AE0; --f-science:#6FB3D6; --f-writing:#E2BC62; --f-leaders:#9CC27F;
  --f-philosophy:#CFA57F; --f-exploration:#6CC9B8; --f-invention:#EE9562; --f-you:#D4AF5A;
  --rel-warm:#E69A6E; --rel-learn:#6FB3D6; --rel-rival:#E07A5A; --rel-met:#A49A88;
  --glow:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,175,90,.10), transparent 70%);
  --shadow:0 10px 30px rgba(0,0,0,.35); --bar:rgba(24,23,21,.78); --land:#26231F; --land-line:#3B372F; --lamp:#F2C969; --lamp-core:#FFE7A8; --lamp-ring:rgba(255,231,168,.9);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:15px/1.55 var(--ui); -webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 48px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
button,select,input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.wrap{max-width:1080px; margin:0 auto}
.yr{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.muted{color:var(--ink-3)}
h1,h2,h3{font-family:var(--display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em}
.eyebrow{font:600 11px/1 var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}

/* Masthead */
.mast{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding-block:18px 10px}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; color:var(--ink)}
.brand:hover{text-decoration:none}
.brand b{font:700 24px/1 var(--display); letter-spacing:-.02em}
.brand span{font-size:12px; color:var(--ink-3)}
.search{position:relative; flex:1 1 260px; max-width:380px}
.search input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--rule); border-radius:999px; background:var(--surface)}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.results{position:absolute; z-index:30; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:0 12px 32px rgba(0,0,0,.14); overflow:hidden}
.results a{display:flex; justify-content:space-between; gap:12px; padding:9px 12px; color:var(--ink)}
.results a:hover,.results a.on{background:var(--accent-soft); text-decoration:none}
.results small{color:var(--ink-3); white-space:nowrap}
.results .none{padding:10px 12px; color:var(--ink-3)}

nav.tabs{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--rule);
  display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
nav.tabs a{padding:11px 12px 10px; color:var(--ink-2); font-weight:500; border-bottom:2px solid transparent; white-space:nowrap}
nav.tabs a:hover{text-decoration:none; color:var(--ink)}
nav.tabs a.on{color:var(--ink); border-bottom-color:var(--accent)}

main{padding-top:28px; display:flex; flex-direction:column; gap:40px}
section{display:flex; flex-direction:column; gap:14px; min-width:0}
.sec-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px}
.sec-head h2{font-size:24px}
.sec-head p{margin:0; color:var(--ink-3); font-size:14px}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--rule); background:var(--surface); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip .dot{width:8px; height:8px}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--fc); flex:none}
.tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--ink-2)}

/* Hero compare */
.hero{display:grid; grid-template-columns:minmax(0,1fr); gap:20px}
.hero h1{font-size:clamp(30px, 5.4vw, 48px); line-height:1.08; max-width:18ch}
.hero .lede{margin:0; color:var(--ink-2); font-size:16px; max-width:60ch}
.cmp{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:16px}
.cmp-pick{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:end}
.cmp-pick label{display:flex; flex-direction:column; gap:5px; min-width:0}
.cmp-pick select{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--bg)}
.swap{border:1px solid var(--rule); background:var(--bg); border-radius:8px; padding:8px 10px; cursor:pointer; color:var(--ink-2)}
.verdict{display:flex; flex-direction:column; gap:10px}
.verdict .word{font:700 13px/1 var(--ui); letter-spacing:.12em; text-transform:uppercase}
.verdict.yes .word{color:var(--f-leaders)} .verdict.no .word{color:var(--rel-rival)}
.verdict h3{font-size:clamp(22px,3.6vw,30px); line-height:1.15}
.verdict p{margin:0; color:var(--ink-2); max-width:64ch}
.knew{border-left:3px solid var(--rel-warm); padding:4px 0 4px 12px; color:var(--ink)!important}
.bridges{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px; color:var(--ink-2)}
@media (max-width:560px){ .cmp-pick{grid-template-columns:minmax(0,1fr)} .swap{justify-self:start} }

/* two-bar compare chart */
.duo{position:relative; padding:22px 0 26px; margin-top:4px}
.duo .row{position:relative; height:30px; margin-bottom:8px}
.duo .b{position:absolute; top:0; bottom:0; border-radius:6px; background:var(--surface); background:color-mix(in srgb, var(--fc) 22%, var(--surface)); border-left:3px solid var(--fc);
  display:flex; align-items:center; padding:0 8px; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:6px; color:var(--ink)}
.duo .band{position:absolute; top:14px; bottom:20px; background:var(--band); border-left:1px dashed var(--accent); border-right:1px dashed var(--accent)}
.duo .gap{position:absolute; top:14px; bottom:20px; border-top:1px dashed var(--rel-rival); border-bottom:1px dashed var(--rel-rival); background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(179,38,62,.08) 6px 7px)}
.duo .ax{position:absolute; left:0; right:0; bottom:0; height:16px; border-top:1px solid var(--rule)}
.duo .ax span{position:absolute; top:3px; transform:translateX(-50%); font:11px var(--mono); color:var(--ink-3); white-space:nowrap}
.duo .lab{position:absolute; top:0; transform:translateX(-50%); font:500 11px var(--mono); color:var(--accent); white-space:nowrap}

/* fact cards */
.facts{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(260px, 300px); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:8px}
.fact{scroll-snap-align:start; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px}
.fact h3{font-size:18px; line-height:1.25}
.fact p{margin:0; font-size:14px; color:var(--ink-2)}
.fact .links{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:13px; margin-top:auto}
.fact.rand{background:var(--accent-soft); border-color:transparent}
.btn{border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:7px 12px; cursor:pointer; font-weight:500; align-self:flex-start}
.btn.ghost{background:transparent; color:var(--accent)}

/* Timeline */
.tl-ctrl{display:flex; flex-direction:column; gap:10px}
.tl-ctrl .line{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center}
.you-in{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2)}
.you-in input{width:84px; padding:5px 8px; border:1px solid var(--rule); border-radius:8px; background:var(--surface)}
.tl{border:1px solid var(--rule); border-radius:12px; background:var(--surface); overflow:hidden; min-width:0}
.tl-tools{display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.tl-tools button{border:1px solid var(--rule); background:var(--bg); border-radius:7px; min-width:32px; height:30px; padding:0 9px; cursor:pointer; color:var(--ink-2)}
.tl-tools .hint{margin-left:auto; font-size:12px; color:var(--ink-3)}
.tl-scroll{overflow:auto; position:relative; overscroll-behavior-x:contain}
.tl-inner{position:relative; cursor:crosshair}
.tl-axis{position:sticky; top:0; z-index:4; height:28px; background:var(--surface); border-bottom:1px solid var(--rule)}
.tl-axis span{position:absolute; top:7px; font:11px var(--mono); color:var(--ink-3); transform:translateX(-50%); white-space:nowrap}
.tl-grid{position:absolute; top:28px; bottom:0; width:1px; background:var(--rule); opacity:.55}
.ev{position:absolute; height:18px; display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-2); white-space:nowrap; z-index:2}
.ev i{width:9px; height:9px; background:var(--ink-2); transform:rotate(45deg); flex:none; margin-left:-4px}
.ev .rng{position:absolute; left:0; height:3px; top:8px; background:var(--ink-3); opacity:.45; border-radius:2px}
.ev:hover{color:var(--accent); text-decoration:none} .ev:hover i{background:var(--accent)}
.bar{position:absolute; height:22px; border-radius:5px; background:var(--surface); background:color-mix(in srgb, var(--fc) 20%, var(--surface)); border-left:3px solid var(--fc);
  font-size:12px; font-weight:500; color:var(--ink); display:flex; align-items:center; z-index:2; transition:opacity .15s}
.bar span{white-space:nowrap; padding-left:6px}
.bar.out span{position:absolute; left:100%; padding-left:6px}
.bar:hover{text-decoration:none; background:color-mix(in srgb, var(--fc) 34%, var(--surface))}
.bar.cut-l{border-top-left-radius:0; border-bottom-left-radius:0; border-left-style:dashed}
.bar.you{background:var(--accent-soft); border-left-color:var(--accent); cursor:default}
.tl.has-cursor .bar.dim,.tl.has-cursor .ev.dim{opacity:.22}
.cursor{position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:5; pointer-events:none}
.cursor b{position:sticky; top:4px; display:inline-block; margin-left:5px; background:var(--accent); color:var(--accent-ink); font:500 11px var(--mono); padding:2px 6px; border-radius:4px}
.tl-year{padding:12px 14px; border-top:1px solid var(--rule); font-size:14px; display:flex; flex-direction:column; gap:8px}
.tl-year .names{display:flex; flex-wrap:wrap; gap:4px 12px}
.tl-year .names a{display:inline-flex; align-items:center; gap:5px; color:var(--ink)}

/* Lists */
.list{display:flex; flex-direction:column}
.list .grp{font:600 12px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding:22px 0 8px; border-bottom:1px solid var(--rule)}
.item{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; padding:11px 0; border-bottom:1px solid var(--rule); color:var(--ink); align-items:center}
.item:hover{text-decoration:none; background:linear-gradient(90deg, transparent, var(--accent-soft) 40%, transparent)}
.item .nm{font-weight:500; display:flex; align-items:center; gap:8px; min-width:0}
.item .nm span{min-width:0}
.item .sub{grid-column:1; font-size:13px; color:var(--ink-3)}
.item .rt{grid-row:1 / span 2; grid-column:2; text-align:right; font-size:13px; color:var(--ink-2)}
.filters{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center}
.filters input[type=search]{padding:8px 12px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); flex:1 1 220px; max-width:320px}
.filters select{padding:7px 10px; border:1px solid var(--rule); border-radius:8px; background:var(--surface)}

/* event chronology */
.chrono{display:flex; flex-direction:column}
.chrono .grp{font:600 20px/1.2 var(--display); padding:26px 0 10px}
.ch-item{display:grid; grid-template-columns:92px minmax(0,1fr); gap:14px; padding:10px 0; border-top:1px solid var(--rule); color:var(--ink)}
.ch-item:hover{text-decoration:none; background:linear-gradient(90deg, var(--accent-soft), transparent 70%)}
.ch-item .yr{color:var(--accent); font-size:14px; padding-top:2px}
.ch-item b{font-weight:600}
.ch-item p{margin:2px 0 0; font-size:13px; color:var(--ink-3)}

/* places grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px}
.place{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); padding:14px 16px; color:var(--ink); display:flex; flex-direction:column; gap:6px}
.place:hover{text-decoration:none; border-color:var(--accent)}
.place h3{font-size:19px}
.place .yr{font-size:12px; color:var(--ink-3)}
.place p{margin:0; font-size:13px; color:var(--ink-2)}

/* detail pages */
.crumbs{font-size:13px; color:var(--ink-3); display:flex; gap:6px; flex-wrap:wrap}
.d-head{display:flex; flex-direction:column; gap:10px; padding-bottom:6px}
.d-head h1{font-size:clamp(32px, 6vw, 52px); line-height:1.05}
.d-meta{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; color:var(--ink-2)}
.d-meta .yr{font-size:16px; color:var(--ink)}
.bio{font:400 19px/1.55 var(--display); max-width:62ch; margin:0; color:var(--ink)}
.two{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:28px}
@media (max-width:820px){ .two{grid-template-columns:minmax(0,1fr)} }
.conn{display:flex; flex-direction:column}
.conn a.row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:10px 0; border-bottom:1px solid var(--rule); color:var(--ink)}
.conn a.row:hover{text-decoration:none; background:linear-gradient(90deg, var(--accent-soft), transparent 70%)}
.conn .who{font-weight:600; display:flex; align-items:center; gap:8px}
.conn .note{grid-column:1 / -1; font-size:14px; color:var(--ink-2)}
.rel{font:600 11px/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--rc); white-space:nowrap; align-self:center}
.graph{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:6px}
.graph svg{display:block; width:100%; height:auto}
.graph text{font-family:var(--ui)}
.over .item .ov{display:block; height:4px; border-radius:2px; background:var(--fc); opacity:.7; margin-top:6px}
.more{border:0; background:none; color:var(--accent); cursor:pointer; padding:10px 0; font-weight:500; align-self:flex-start}
.empty{color:var(--ink-3); font-size:14px; margin:0}
.miss{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:10px}
.miss a{background:var(--surface); border:1px dashed var(--rule); border-radius:var(--r); padding:12px 14px; color:var(--ink); display:flex; flex-direction:column; gap:3px}
.miss a:hover{text-decoration:none; border-color:var(--rel-rival)}
.miss small{color:var(--ink-3)}
.counts{display:flex; gap:28px; flex-wrap:wrap}
.counts div{display:flex; flex-direction:column}
.counts b{font:600 30px/1 var(--display)}
.counts span{font-size:12px; color:var(--ink-3)}
footer{margin-top:56px; padding-top:16px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-3); max-width:70ch}

/* ---------- upgrade: museum at night ---------- */
[hidden]{display:none!important}
@media (max-width:640px){ .search{order:3; flex-basis:100%; max-width:none} .brand span{display:none} }
body{background-image:var(--glow); background-repeat:no-repeat; background-attachment:fixed}
.brand b{color:var(--ink)} .brand b em{font-style:normal; color:var(--gold)}
.theme{border:1px solid var(--rule); background:var(--surface); border-radius:999px; padding:7px 12px; cursor:pointer; color:var(--ink-2); font-size:13px; display:inline-flex; gap:6px; align-items:center}
.theme:hover{border-color:var(--gold); color:var(--ink)}
nav.tabs a.on{border-bottom-color:var(--gold); color:var(--ink)}
.ev.k-war i,.ev.k-turning i,.ev.k-disaster i{background:var(--rust)}
.ev.k-myth i{background:var(--lab-myth); border-radius:50%; transform:none}
.ev.k-myth{color:var(--lab-myth); font-style:italic}
.kind{font:600 10.5px/1 var(--ui); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.kind.war,.kind.turning,.kind.disaster{color:var(--rust)}

/* honesty labels */
.lab{display:inline-flex; align-items:center; gap:5px; font:600 10.5px/1 var(--ui); letter-spacing:.07em; text-transform:uppercase; color:var(--lc); border:1px solid color-mix(in srgb, var(--lc) 45%, transparent); border-radius:999px; padding:3px 7px 3px 6px; white-space:nowrap; vertical-align:middle}
.lab::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--lc)}
.lab-verified{--lc:var(--lab-verified)} .lab-likely{--lc:var(--lab-likely)} .lab-disputed{--lc:var(--lab-disputed)} .lab-myth{--lc:var(--lab-myth)} .lab-unchecked{--lc:var(--ink-3)}
.lab-verified::before{background:none; width:auto; height:auto; content:"✓"; font-size:10px}
details.why{font-size:13.5px; color:var(--ink-2)}
details.why summary{cursor:pointer; color:var(--ink-3); font-size:12.5px; list-style:none; display:inline-flex; gap:6px; align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+"; font:600 12px var(--mono); color:var(--gold)}
details.why[open] summary::before{content:"–"}
details.why p{margin:6px 0 0; padding-left:12px; border-left:2px solid var(--rule)}
.mythy{background:var(--myth-tint)!important; border-color:color-mix(in srgb, var(--lab-myth) 30%, var(--rule))!important}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); cursor:pointer; user-select:none}
.toggle input{accent-color:var(--lab-myth); width:16px; height:16px}
.gens{font-size:14px; color:var(--ink-2); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.gens b{font:600 15px var(--display); color:var(--gold)}

/* cards and panels */
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.panel h3{font-size:20px}
.panel p{margin:0}
.cols{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px}
.stack{display:flex; flex-direction:column; gap:10px}
.row-btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{border-color:var(--gold); background:var(--gold); color:var(--accent-ink)}
.btn.ghost{background:transparent; color:var(--gold)}
.btn.sm{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.5; cursor:default}

/* time machine */
.tm-head{display:flex; flex-direction:column; gap:10px}
.tm-year{font:700 clamp(64px, 16vw, 132px)/.9 var(--display); letter-spacing:-.03em; color:var(--gold); font-variant-numeric:lining-nums}
.tm-year small{font-size:.32em; color:var(--ink-2); letter-spacing:0; margin-left:.2em}
.tm-sub{display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--ink-2); font-size:15px}
.tm-ctl{display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:14px}
.tm-ctl input[type=range]{width:100%; accent-color:var(--gold)}
.tm-ctl .line{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.tm-ctl input[type=number]{width:96px; padding:6px 8px; border:1px solid var(--rule); border-radius:8px; background:var(--bg); font-family:var(--mono)}
.step{border:1px solid var(--rule); background:var(--bg); border-radius:8px; padding:5px 9px; cursor:pointer; font:500 13px var(--mono); color:var(--ink-2)}
.step:hover{border-color:var(--gold); color:var(--ink)}
.alive-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px}
.alive-grid a{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:9px 12px; background:var(--surface); border:1px solid var(--rule); border-radius:10px; color:var(--ink); min-width:0}
.alive-grid a:hover{text-decoration:none; border-color:var(--gold)}
.alive-grid .nm{display:flex; align-items:center; gap:7px; min-width:0; font-weight:500}
.alive-grid .nm span{min-width:0; line-height:1.3}
.alive-grid .ag{font:500 13px var(--mono); color:var(--ink-2); white-space:nowrap}
.alive-grid .note{display:block; font:500 11px var(--ui); color:var(--gold)}
.world{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px}
.world .panel h3{font-size:17px; display:flex; gap:8px; align-items:center}
.wl{display:flex; flex-direction:column; gap:8px; font-size:14px}
.wl a,.wl div.it{color:var(--ink); display:flex; flex-direction:column; gap:1px}
.wl a:hover{text-decoration:none} .wl a:hover b{color:var(--gold)}
.wl small{color:var(--ink-3); font-size:12.5px}
.wl .none{color:var(--ink-3)}
.daily-life{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px}
.daily-life .panel{gap:8px}
.daily-life h4{margin:0; font:600 12px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--gold)}
.daily-life p{font-size:14px; color:var(--ink-2)}
.daily-life p b{color:var(--ink); font-weight:600}

/* works */
.works{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px}
.work{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden}
.work::before{content:""; position:absolute; inset:0 0 auto; height:3px; background:var(--fc)}
.work h3{font-size:19px; line-height:1.2}
.work .by{font-size:13px; color:var(--ink-2); display:flex; gap:6px 12px; flex-wrap:wrap; align-items:center}
.work p{margin:0; font-size:14px; color:var(--ink-2)}
.work .where{font-size:12.5px; color:var(--ink-3)}
.play{display:inline-flex; gap:8px; align-items:center; border:1px solid var(--gold); color:var(--gold); background:transparent; border-radius:999px; padding:5px 12px 5px 9px; cursor:pointer; font-weight:500; font-size:13px; align-self:flex-start}
.play[aria-pressed="true"]{background:var(--gold); color:var(--accent-ink)}
.play svg{flex:none}

/* stories */
.levels{display:inline-flex; border:1px solid var(--rule); border-radius:999px; padding:3px; background:var(--surface); gap:2px; flex-wrap:wrap}
.levels button{border:0; background:transparent; padding:6px 12px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--ink-2)}
.levels button[aria-pressed="true"]{background:var(--gold); color:var(--accent-ink); font-weight:600}
.story{display:flex; flex-direction:column; gap:14px; max-width:68ch}
.story p{margin:0; font:400 17.5px/1.65 var(--display)}
.story h3{font-size:20px; margin-top:6px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.story .sec{display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid var(--rule)}
.check{font-size:13.5px; color:var(--ink-2); display:flex; flex-direction:column; gap:4px; margin:0; padding-left:18px}

/* ---------- v4: chapters and real pictures ---------- */
.fig{margin:0; display:flex; flex-direction:column; gap:0; min-width:0}
.fig-frame{position:relative; width:100%; max-height:70vh; background:var(--sunk); border-radius:14px; overflow:hidden; display:flex; justify-content:center}
.fig-frame img{display:block; width:100%; height:100%; object-fit:contain}
.fig-frame.broken{background:linear-gradient(135deg, var(--accent-soft), var(--sunk)); min-height:180px; align-items:center}
.fig-frame.broken img{display:none}
.fig-frame.broken::after{content:attr(data-t); font:600 22px/1.25 var(--display); color:var(--ink-2); padding:24px; text-align:center; max-width:24ch}
.credit{font-size:12.5px; line-height:1.45; color:var(--ink-3); padding:8px 2px 0; display:flex; flex-direction:column; gap:6px; overflow-wrap:anywhere}
.credit i{font-style:italic}
.fig-note{color:var(--ink-2); font-size:13.5px}
.ch-top{display:flex; flex-direction:column; gap:20px}
.ch-hero .fig-frame{max-height:72vh; margin:0 auto}
.ch-lede{font-size:21px}
.ch-portrait{display:flex; gap:10px; align-items:center; font-size:12.5px; color:var(--ink-3); max-width:420px}
.ch-portrait img{width:56px; height:56px; object-fit:cover; object-position:center 20%; border-radius:50%; border:1px solid var(--rule); flex:none}
.ch-portrait:hover{text-decoration:none; color:var(--ink-2)}
@media (min-width:900px){
  .ch-top{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; gap:32px}
  .ch-hero .fig-frame{max-height:640px}
  .ch-top .d-head{padding-top:8px}
}
.ch-wrap{display:flex; flex-direction:column; gap:36px}
.ch-chips{position:sticky; top:env(safe-area-inset-top, 0px); z-index:15; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:10px 0; margin:-10px 0; background:var(--bg); border-bottom:1px solid var(--rule)}
.ch-chips::-webkit-scrollbar{display:none}
.ch-chips .chip{white-space:nowrap; flex:none}
.ch-chips .chip:hover{text-decoration:none}
.ch-sec{scroll-margin-top:calc(70px + env(safe-area-inset-top, 0px)); display:flex; flex-direction:column; gap:14px}
.ch-body{display:flex; flex-direction:column; gap:14px; max-width:68ch}
.ch-body p,.ch-lp p{margin:0; font:400 17.5px/1.65 var(--display); overflow-wrap:anywhere}
.ch-lp{display:flex; flex-direction:column; gap:6px}
.ch-lp .lab{margin-right:4px; vertical-align:2px}
.fig-inline .fig-frame{max-height:460px}
.fig-inline{max-width:68ch}
.myths{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap:12px}
.ch-body:has(.myths){max-width:none}
.myth-card{background:var(--myth-tint); border:1px solid var(--rule); border-left:4px solid var(--lc); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.myth-card h3{font-size:19px; line-height:1.3}
.myth-card p{font-size:16px!important}
.myth-card .eyebrow{margin-top:2px}
.ch-more{margin-top:12px; padding-top:28px; border-top:2px solid var(--gold)}
.tmm-ask{display:flex; flex-direction:column; gap:12px}
.tmm-ask p{margin:0}
.tmm{border:2px dashed var(--ink-3); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; margin-top:4px}
.tmm-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; color:var(--ink-3)}
.tmm-text{display:flex; flex-direction:column; gap:10px; max-width:68ch}
.tmm-text p{margin:0; font:400 17px/1.6 var(--display)}
.tmm-text h3{font-size:18px; margin-top:4px}
.results a.has-snip{flex-wrap:wrap}
.results .snip{flex-basis:100%; white-space:normal; font-size:12.5px; line-height:1.4; color:var(--ink-2)}
.results mark{background:var(--accent-soft); color:inherit; border-radius:2px; padding:0 1px}

/* chains */
.chain{display:flex; flex-direction:column; gap:0; position:relative}
.chain .st{display:grid; grid-template-columns:70px 20px minmax(0,1fr); gap:0 10px; align-items:start}
.chain .st .yr{color:var(--gold); font-size:14px; padding-top:1px; text-align:right}
.chain .st .pin{position:relative; align-self:stretch; display:flex; justify-content:center}
.chain .st .pin::before{content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--rule)}
.chain .st:first-child .pin::before{top:8px} .chain .st:last-child .pin::before{bottom:calc(100% - 10px)}
.chain .st .pin i{position:relative; margin-top:5px; width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px var(--surface)}
.chain .st .pin i.dis{background:var(--lab-disputed)}
.chain .st .bd{padding-bottom:16px; display:flex; flex-direction:column; gap:5px; font-size:14.5px}
.chain .st .bd a{font-size:13px}
.chain-card summary{cursor:pointer; list-style:none; display:flex; flex-direction:column; gap:4px}
.chain-card summary::-webkit-details-marker{display:none}
.chain-card summary h3::after{content:" +"; color:var(--gold); font-family:var(--mono); font-size:15px}
.chain-card[open] summary h3::after{content:" –"}
.chain-card[open] summary{margin-bottom:12px}
.chain-card summary p{color:var(--ink-2); font-size:14px}

/* quiz and games */
.quiz{display:flex; flex-direction:column; gap:14px}
.quiz .q{font:600 clamp(20px, 3.4vw, 26px)/1.25 var(--display); margin:0}
.opts{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px}
.opt{border:1px solid var(--rule); background:var(--bg); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:left; font-weight:500; color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--lab-verified); background:color-mix(in srgb, var(--lab-verified) 16%, var(--bg))}
.opt.wrong{border-color:var(--rust); background:var(--rust-soft)}
.explain{display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--rule); padding-top:14px}
.explain .res{font:700 13px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase}
.explain .res.ok{color:var(--lab-verified)} .explain .res.no{color:var(--rust)}
.explain p{margin:0; color:var(--ink-2)}
.score{display:flex; gap:22px; flex-wrap:wrap}
.score div{display:flex; flex-direction:column}
.score b{font:600 26px/1 var(--display); color:var(--gold)}
.score span{font-size:12px; color:var(--ink-3)}
.modes{display:flex; flex-wrap:wrap; gap:6px}
.game-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px}
.game-card{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px; color:var(--ink); display:flex; flex-direction:column; gap:6px}
.game-card:hover{text-decoration:none; border-color:var(--gold)}
.game-card h3{font-size:19px}
.game-card p{margin:0; font-size:14px; color:var(--ink-2)}
.race{display:flex; flex-direction:column; gap:8px}
.race button{display:flex; justify-content:space-between; gap:10px; border:1px solid var(--rule); background:var(--bg); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:left; font-weight:500; color:var(--ink)}
.race button:hover:not(:disabled){border-color:var(--gold)}
.race button.done{border-color:var(--lab-verified); background:color-mix(in srgb, var(--lab-verified) 14%, var(--bg)); cursor:default}
.race button.bad{animation:shake .3s; border-color:var(--rust)}
.race .n{font:600 13px var(--mono); color:var(--gold)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.clock{font:600 28px var(--mono); color:var(--gold)}
.path{display:flex; flex-direction:column; gap:0}
.path .hop{display:grid; grid-template-columns:20px minmax(0,1fr); gap:10px}
.path .hop .pin{position:relative; display:flex; justify-content:center}
.path .hop .pin::before{content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--gold); opacity:.5}
.path .hop:last-child .pin::before{bottom:calc(100% - 12px)} .path .hop:first-child .pin::before{top:12px}
.path .hop .pin i{position:relative; width:12px; height:12px; border-radius:50%; background:var(--fc); margin-top:6px; box-shadow:0 0 0 3px var(--surface)}
.path .hop .bd{padding-bottom:14px; display:flex; flex-direction:column; gap:4px}
.path .hop .bd .who{font-weight:600}
.path .hop .bd .link{font-size:13.5px; color:var(--ink-2); padding:6px 10px; border-left:2px solid var(--rule); margin:4px 0 0}
.pickers{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.pickers label{display:flex; flex-direction:column; gap:5px; min-width:0}
.pickers select,.panel select,.panel input[type=number]{width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--bg)}
@media (max-width:560px){ .pickers{grid-template-columns:minmax(0,1fr)} }
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px}
.card{aspect-ratio:3/4; border-radius:12px; border:1px solid var(--rule); background:var(--surface); padding:12px; display:flex; flex-direction:column; gap:6px; color:var(--ink); position:relative; overflow:hidden}
.card::after{content:""; position:absolute; inset:auto 0 0; height:4px; background:var(--fc)}
.card:hover{text-decoration:none; border-color:var(--gold)}
.card .yr{font-size:11.5px; color:var(--ink-3)}
.card b{font:600 16px/1.2 var(--display)}
.card .rar{margin-top:auto; font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.card.legend{border-color:var(--gold); background:linear-gradient(160deg, var(--accent-soft), var(--surface) 60%)}
.card.legend .rar{color:var(--gold)}
.card.lock{border-style:dashed; background:transparent; align-items:center; justify-content:center; text-align:center; color:var(--ink-3)}
.card.lock b{font-size:30px; color:var(--rule)}
.card.lock::after{display:none}
.imagine{border:2px dashed var(--lab-myth); background:var(--myth-tint); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
.imagine .ban{font:700 12px/1.3 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--lab-myth)}
.imagine p{margin:0; font:400 17px/1.6 var(--display); white-space:pre-wrap}

/* talk */
.who-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px}
.chat{display:flex; flex-direction:column; gap:14px}
.msg{max-width:min(620px, 92%); display:flex; flex-direction:column; gap:8px}
.msg .bub{padding:11px 14px; border-radius:14px; font-size:15.5px; line-height:1.55; white-space:pre-wrap}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--accent-soft); border-bottom-right-radius:4px}
.msg.them .bub{background:var(--surface); border:1px solid var(--rule); border-bottom-left-radius:4px; font-family:var(--display); font-size:17px}
.msg.them .nm{font:600 11px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--gold)}
.receipt{border:1px dashed var(--rule); border-radius:10px; padding:10px 12px; font-size:13px; display:flex; flex-direction:column; gap:8px; background:var(--sunk)}
.receipt .hd{font:600 10.5px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.receipt .ln{display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 10px; align-items:start}
.receipt .ln .c{color:var(--ink)} .receipt .ln .n{grid-column:2; color:var(--ink-3)}
.composer{display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:10px 0 4px}
.composer input{flex:1; min-width:0; padding:11px 14px; border-radius:999px; border:1px solid var(--rule); background:var(--surface)}
.typing{color:var(--ink-3); font-style:italic; font-size:14px}
.notice{border:1px solid var(--rule); border-radius:12px; padding:14px 16px; background:var(--surface); color:var(--ink-2); font-size:14.5px}

@media (prefers-reduced-motion: reduce){ *{transition:none!important; scroll-behavior:auto!important} }
/* walk in */
:root{--wk-s1:#E7D6B3;--wk-s2:#F6EBD2;--wk-far:#D9C6A0;--wk-lm:#B79F78;--wk-lm2:#C8B28B;--wk-h:#8E765A;--wk-h2:#9E8667;--wk-win:#F7E6B0;--wk-wo:#6E5B44;--wk-road:#BBA986;--wk-walk:#CDBC99;--wk-line:#A8957A;--wk-star:transparent;--wk-moon:#F3D27A;--wk-glow:rgba(255,226,150,0);--wk-head:#FBF6EA;--wk-tag:rgba(43,34,25,.82);--wk-tagt:#FBF6EA;--wk-snow:#F7F1E3;--wk-board:#5B4C3B;--wk-go:0}
[data-theme="dark"]{--wk-s1:#0B1220;--wk-s2:#2A2232;--wk-far:#1E1D2A;--wk-lm:#34324A;--wk-lm2:#403D57;--wk-h:#17161C;--wk-h2:#1D1B22;--wk-win:#F2C46B;--wk-wo:#26242C;--wk-road:#1A1918;--wk-walk:#24221F;--wk-line:#3A362F;--wk-star:#EFE6CF;--wk-moon:#EFE2C2;--wk-glow:rgba(242,196,107,.22);--wk-head:#E8DCC4;--wk-tag:rgba(20,19,18,.86);--wk-tagt:#EDE3CF;--wk-snow:#C9C3D6;--wk-board:#3A3428;--wk-go:.38}
.wk-head h2{font:600 clamp(28px,5vw,44px)/1.1 var(--display);margin:4px 0 6px}
.wk-stage{position:relative;margin:0 -16px;padding:0}
.wk-scroll{overflow-x:auto;overflow-y:hidden;border-block:1px solid var(--rule);cursor:grab;scrollbar-width:thin;-webkit-overflow-scrolling:touch;outline:none}
.wk-scroll.drag{cursor:grabbing}
.wk-svg{display:block}
.wk-svg .s1{stop-color:var(--wk-s1)}.wk-svg .s2{stop-color:var(--wk-s2)}
.wk-svg .star{fill:var(--wk-star)}.wk-svg .moonc{fill:var(--wk-moon)}
.wk-far rect{fill:var(--wk-far)}
.wk-lm *{fill:var(--wk-lm)}.wk-lm .lt{fill:var(--wk-lm2)}.wk-lm .snow{fill:var(--wk-snow)}

function imgFig(slug, cls, eager){

  const frame = m ? `<div class="fig-frame" data-t="${esc(title)}" style="${ar}"><img src="${esc(m.src)}" alt="${esc(title + (m.by ? ", " + m.by : ""))}" width="${m.w}" height="${m.h}" ${eager ? "" : `loading="lazy" `}decoding="async"></div>`
                  : `<div class="fig-frame broken" data-t="${esc(title)}" style="${ar}"></div>`;
  const credit = m ? `<figcaption class="credit">${note ? `<span class="fig-note">${labHTML(note[0])} ${esc(note[1])}</span>` : ""}<span>${esc(m.by)}. <i>${esc(m.title)}</i>, ${esc(m.date)}. ${esc(m.coll)}. Public domain${m.page ? ` · <a href="${esc(m.page)}" target="_blank" rel="noopener">source</a>` : ""}. Not made by AI.</span></figcaption>` : "";

const tmmCache = new Map();

async function tellMore(id){

  const prompt = `You are writing for a history museum app. The page labels what you write "AI draft, not yet checked".\n\nWrite a story of ${p.n} (${span(p)}) of 350 to 450 words, in four or five short paragraphs, each starting with a short heading line that begins with "## ". Use ONLY the notes below. Do not add any date, number, name, place or quote that is not in the notes. Where the notes are thin, say less rather than guess. You may explain how the events listed affected someone of their time in general terms, but do not claim they took part unless the notes say so. Plain, lively prose for a curious adult. No title, no preamble.\n\nNOTES\nWho: ${p.n}, ${span(p)}. ${p.bio}\nField: ${F[p.f].label}. Lived mainly in: ${p.c.map(c => C[c] ? C[c].n : c).join(", ")}.\n${ws.length ? "Works:\n" + ws.join("\n") + "\n" : ""}${cs.length ? "Real connections:\n" + cs.join("\n") + "\n" : ""}${evs.length ? "Events in their lifetime:\n" + evs.join("\n") : ""}`;
  if (btn) btn.disabled = true;
  out.innerHTML = tmmBox(`<p class="typing">Writing...</p>`);
  const tx = out.querySelector(".tmm-text");

    const r = await s(prompt, {modelTier:"default", cache:false, onText: ({text}) => { if (tx.isConnected) tx.innerHTML = tmmParas(text); }});

/* measuring label widths for timeline lane packing */
let mctx = null; try { mctx = document.createElement("canvas").getContext("2d"); } catch(e){}
const measure = (txt, size, weight) => { if (!mctx) return txt.length * size * 0.56; mctx.font = `${weight||500} ${size}px Inter, system-ui, sans-serif`; return mctx.measureText(txt).width; };

/* ---------- Timeline component ---------- */
function niceStep(ppy){
  const steps = [1,2,5,10,20,25,50,100,200,250,500,1000];
  for (const s of steps) if (s * ppy >= 64) return s;
  return 1000;
}
function Timeline(host, opt){
  const t = {ppy:null, cursor:null};
  host.classList.add("tl");
  host.innerHTML = `<div class="tl-tools">
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
      <button type="button" data-z="fit">Fit</button>
      <span class="hint">Tap anywhere on the timeline to see who was alive that year</span>
    </div>
    <div class="tl-scroll" style="max-height:${opt.maxH||"62vh"}"><div class="tl-inner"></div></div>
    <div class="tl-year" hidden></div>`;
  const scroll = host.querySelector(".tl-scroll"), inner = host.querySelector(".tl-inner"), yearBox = host.querySelector(".tl-year");
  const PAD = 14;

  function fitPpy(){ const w = Math.max(280, scroll.clientWidth - PAD * 2 - 4); return Math.max(w / (astro(opt.end) - astro(opt.start)), opt.minPpy || 0.2); }
  function render(keepCenter){
    const a0 = astro(opt.start), a1 = astro(opt.end);
    let center = null;
    if (keepCenter && t.ppy) center = (scroll.scrollLeft + scroll.clientWidth / 2 - PAD) / t.ppy + a0;
    if (!t.ppy) t.ppy = fitPpy();
    const ppy = t.ppy, W = Math.ceil((a1 - a0) * ppy) + PAD * 2;
    const X = y => (astro(y) - a0) * ppy + PAD;
    const html = [];
    // axis
    const step = niceStep(ppy);
    let ticks = "", grid = "";
    const first = Math.ceil(a0 / step) * step;
    for (let a = first; a <= a1; a += step) {
      const x = (a - a0) * ppy + PAD;
      const lbl = a <= 0 ? (1 - a) + " BC" : String(a);
      ticks += `<span style="left:${x}px">${a === 0 ? "1 BC" : lbl}</span>`;
      grid += `<i class="tl-grid" style="left:${x}px"></i>`;
    }
    // events lanes
    const evs = opt.events().filter(e => astro(evEnd(e)) >= a0 && astro(e.y) <= a1).sort((x, y) => astro(x.y) - astro(y.y));
    const evLanes = [];
    const showLabels = opt.eventLabels !== false;
    evs.forEach(e => {
      const x0 = X(e.y), x1 = X(evEnd(e));
      const lw = showLabels ? measure(e.n, 11, 400) + 14 : 10;
      const ext1 = Math.max(x1, x0 + lw);
      let lane = evLanes.findIndex(r => r <= x0 - 8);
      if (lane < 0) { lane = evLanes.length; evLanes.push(0); }
      evLanes[lane] = ext1; e._lane = lane; e._x0 = x0; e._x1 = x1;
    });
    const evTop = 34, evH = 20;
    const peopleTop = evTop + Math.max(evLanes.length, evs.length ? 1 : 0) * evH + (evs.length ? 12 : 4);
    evs.forEach(e => {
      const rng = e.e ? `<span class="rng" style="width:${Math.max(3, e._x1 - e._x0)}px"></span>` : "";
      html.push(`<a class="ev k-${e.k || "turning"}" href="#e-${e.id}" data-y0="${astro(e.y)}" data-y1="${astro(evEnd(e))}" title="${esc(e.n)}, ${fy(e.y, e.a)}${e.e ? "–" + e.e : ""}" style="left:${e._x0}px;top:${evTop + e._lane * evH}px">${rng}<i></i>${showLabels ? esc(e.n) : ""}</a>`);
    });
    // people lanes
    let ppl = opt.people().filter(p => astro(end(p)) >= a0 && astro(p.b) <= a1);
    ppl.sort((x, y) => astro(x.b) - astro(y.b) || astro(x.d) - astro(y.d));
    if (opt.pin) { const pin = ppl.filter(p => p.id === opt.pin); ppl = pin.concat(ppl.filter(p => p.id !== opt.pin)); }
    const lanes = [];
    ppl.forEach(p => {
      const x0 = Math.max(PAD - 4, X(p.b)), x1 = Math.min(W - 2, X(end(p)) );
      const w = Math.max(4, x1 - x0), lw = measure(p.n, 12, 500) + 12;
      const inside = w >= lw + 4;
      const ext = inside ? x0 + w : x0 + w + lw + 4;
      let lane;
      if (opt.pin === p.id) { lane = lanes.length; lanes.push(Infinity); }
      else { lane = lanes.findIndex(r => r <= x0 - 6); if (lane < 0) { lane = lanes.length; lanes.push(0); } lanes[lane] = ext; }
      const cut = astro(p.b) < a0 ? " cut-l" : "";
      const tag = p.id === "you" ? "span" : "a";
      const href = p.id === "you" ? "" : ` href="#p-${p.id}"`;
      html.push(`<${tag} class="bar ${inside ? "in" : "out"}${cut}${p.id === "you" ? " you" : ""}"${href} data-y0="${astro(p.b)}" data-y1="${astro(end(p))}" title="${esc(p.n)}, ${span(p)}" style="left:${x0}px;width:${w}px;top:${peopleTop + lane * 28}px;${fc(p.f)}"><span>${esc(p.n)}</span></${tag}>`);
    });
    const H_ = peopleTop + Math.max(1, lanes.length) * 28 + 14;
    inner.style.width = W + "px"; inner.style.height = H_ + "px";
    inner.innerHTML = `<div class="tl-axis" style="width:${W}px">${ticks}</div>${grid}${html.join("")}<div class="cursor" hidden><b></b></div>`;
    if (!ppl.length && !evs.length) inner.insertAdjacentHTML("beforeend", `<p class="empty" style="position:absolute;top:44px;left:${PAD}px">Nothing in this range with these filters.</p>`);
    if (center != null) scroll.scrollLeft = (center - a0) * ppy + PAD - scroll.clientWidth / 2;
    else if (opt.startAt != null) scroll.scrollLeft = Math.max(0, X(opt.startAt) - 30);
    applyCursor();
  }
  function applyCursor(){
    const cur = inner.querySelector(".cursor");
    if (t.cursor == null) { host.classList.remove("has-cursor"); cur.hidden = true; yearBox.hidden = true; return; }
    const a = astro(t.cursor);
    host.classList.add("has-cursor");
    cur.hidden = false; cur.style.left = ((a - astro(opt.start)) * t.ppy + 14 - 1) + "px";
    cur.querySelector("b").textContent = fy(t.cursor);
    inner.querySelectorAll(".bar,.ev").forEach(el => el.classList.toggle("dim", !(+el.dataset.y0 <= a && a <= +el.dataset.y1)));
    const alive = opt.people().filter(p => p.id !== "you" && isAlive(p, t.cursor)).sort((x, y) => astro(x.b) - astro(y.b));
    const shown = alive.slice(0, 40);
    yearBox.hidden = false;
    yearBox.innerHTML = `<div><b class="yr">${fy(t.cursor)}</b>: ${alive.length ? plural(alive.length, "person") + " here were alive" : "nobody here was alive"}${alive.length ? ", with their ages that year" : ""}. <button type="button" class="more" data-clear style="padding:0 0 0 6px">Clear</button></div>
      <div class="names">${shown.map(p => `<a href="#p-${p.id}">${fieldDot(p.f)}${esc(p.n)} <span class="muted yr">${ageAt(p, t.cursor)}</span></a>`).join("")}${alive.length > 40 ? `<span class="muted">and ${alive.length - 40} more</span>` : ""}</div>`;
  }
  host.addEventListener("click", ev => {
    const z = ev.target.closest("[data-z]");
    if (z) {
      const k = z.dataset.z;
      if (k === "fit") { t.ppy = fitPpy(); render(false); scroll.scrollLeft = 0; return; }
      t.ppy = Math.min(80, Math.max(0.15, t.ppy * (k === "in" ? 1.6 : 1 / 1.6)));
      render(true); return;
    }
    if (ev.target.closest("[data-clear]")) { t.cursor = null; applyCursor(); return; }
    if (ev.target.closest("a") || !ev.target.closest(".tl-inner")) return;
    const r = inner.getBoundingClientRect();
    const a = Math.round((ev.clientX - r.left - 14) / t.ppy + astro(opt.start));
    t.cursor = unastro(Math.max(astro(opt.start), Math.min(astro(opt.end), a)));
    applyCursor();
  });
  t.render = render;
  t.reset = () => { t.ppy = null; t.cursor = null; render(false); };
  t.setCursor = y => { t.cursor = y; applyCursor(); };
  render(false);
  return t;
}

/* ---------- compare (the hero) ---------- */
let cmpA = store.get("ctm-a") || "van-gogh", cmpB = store.get("ctm-b") || "beethoven";
if (!getP(cmpA)) cmpA = "van-gogh"; if (!getP(cmpB)) cmpB = "beethoven";
function personOptions(sel){
  const groups = Object.keys(F).map(f => {
    const ps = H.people.filter(p => p.f === f).sort((a, b) => a.n.localeCompare(b.n));
    return `<optgroup label="${F[f].label}">${ps.map(p => `<option value="${p.id}"${p.id === sel ? " selected" : ""}>${esc(p.n)} (${span(p)})</option>`).join("")}</optgroup>`;
  });
  const you = youYear ? `<option value="you"${sel === "you" ? " selected" : ""}>You (born ${youYear})</option>` : "";
  return you + groups.join("");
}
function duoChart(a, b){
  const lo = Math.min(astro(a.b), astro(b.b)), hi = Math.max(astro(end(a)), astro(end(b)));
  const pad = Math.max(4, Math.round((hi - lo) * 0.06));
  const s = lo - pad, e = hi + pad, W = e - s;
  const pct = x => ((x - s) / W * 100).toFixed(3) + "%";
  const o = ov(a, b);
  let extra = "";
  if (o.len >= 0) extra = `<div class="band" style="left:${pct(o.s)};width:calc(${pct(o.e)} - ${pct(o.s)})"></div><span class="lab" style="left:${pct((o.s + o.e) / 2)}">${o.len} yrs together</span>`;
  else extra = `<div class="gap" style="left:${pct(o.e)};width:calc(${pct(o.s)} - ${pct(o.e)})"></div><span class="lab" style="left:${pct((o.s + o.e) / 2)};color:var(--rel-rival)">${-o.len} yr gap</span>`;
  const row = p => `<div class="row"><div class="b" style="left:${pct(astro(p.b))};width:calc(${pct(astro(end(p)))} - ${pct(astro(p.b))});${fc(p.f)}" title="${esc(p.n)}">${esc(short(p))}</div></div>`;
  const marks = [a.b, end(a), b.b, end(b)].map(astro).sort((x, y) => x - y);
  const uniq = marks.filter((m, i) => i === 0 || m - marks[i - 1] >= W * 0.07);
  const ax = uniq.map(m => `<span style="left:${pct(m)}">${unastro(m) < 0 ? -unastro(m) + " BC" : unastro(m)}</span>`).join("");
  return `<div class="duo">${extra}${row(a)}${row(b)}<div class="ax">${ax}</div></div>`;
}
function bridgesFor(a, b){
  return H.people.filter(p => p.id !== a.id && p.id !== b.id && ov(p, a).len >= 1 && ov(p, b).len >= 1)
    .map(p => ({p, k: Math.min(ov(p, a).len, ov(p, b).len)})).sort((x, y) => y.k - x.k).slice(0, 4);
}
function verdictHTML(){
  const a = getP(cmpA), b = getP(cmpB);
  if (!a || !b) return "";
  if (a.id === b.id) return `<div class="verdict"><h3>Pick two different people.</h3></div>`;
  const o = ov(a, b), c = connBetween(a.id, b.id);
  const aN = esc(a.id === "you" ? "you" : short(a)), bN = esc(b.id === "you" ? "you" : short(b));
  let h, p = "", cls;
  if (o.len >= 0) {
    cls = "yes";
    const mid = unastro(Math.round((o.s + o.e) / 2));
    h = o.len === 0 ? "Yes, but only just. Their lives touched in a single year." : `Yes. They shared ${plural(o.len, "year")} on Earth.`;
    p = `From <span class="yr">${fy(unastro(o.s))}</span> to <span class="yr">${fy(unastro(o.e))}</span> both were alive. In <span class="yr">${fy(mid)}</span>, ${a.id === "you" ? "you were" : aN + " was"} ${ageAt(a, mid)} and ${b.id === "you" ? "you were" : bN + " was"} ${ageAt(b, mid)}.`;
  } else {
    cls = "no";
    const first = astro(end(a)) < astro(b.b) ? a : b, second = first === a ? b : a;
    const gap = -o.len, lt = gap / 70;
    h = `No. They missed each other by ${plural(gap, "year")}.`;
    p = `${esc(first.n)} died in <span class="yr">${fy(first.d, first.a)}</span>. ${esc(second.n)} was born in <span class="yr">${fy(second.b, second.a)}</span>.` +
        (lt >= 1.5 ? ` That gap is about ${Math.round(lt)} human lifetimes of 70 years${youYear ? `, or ${Math.round(gap / (NOW - youYear))} of yours so far` : ""}.` : (lt < 0.5 ? " That's closer than it sounds." : ""));
  }
  const knew = c ? `<p class="knew"><b>They actually knew each other.</b> ${esc(c.note)} ${labHTML(c.lab)}</p>${whyHTML(c.why)}` : "";
  let bridge = "";
  const br = bridgesFor(a, b);
  if (br.length) bridge = `<div class="bridges"><span>${o.len >= 0 ? "Others alive alongside both:" : "Alive at the same time as both:"}</span>${br.map(x => `<a class="chip" href="#p-${x.p.id}" style="${fc(x.p.f)}"><i class="dot"></i>${esc(x.p.n)}</a>`).join("")}</div>`;
  return `<div class="verdict ${cls}"><span class="word">${cls === "yes" ? "Same time" : "Never overlapped"}</span><h3>${h}</h3><p>${p}</p>${knew}${gensHTML(a, b)}${duoChart(a, b)}${bridge}</div>`;
}

function factLinks(links){

}
function randomPair(){
  const pool = H.people.filter(p => astro(p.b) > 1000);
  for (let i = 0; i < 400; i++) {
    const a = pool[Math.floor(Math.random() * pool.length)], b = pool[Math.floor(Math.random() * pool.length)];
    if (a.id === b.id || a.f === b.f || a.c[0] === b.c[0] || connBetween(a.id, b.id)) continue;
    const o = ov(a, b); if (o.len < 8) continue;
    const y = unastro(Math.round((o.s + o.e) / 2));
    return {a, b, o, y};
  }
  return null;
}
function randHTML(){

/* connection graph */
function graphSVG(p){
  const cs = connOf(p.id); if (!cs.length) return "";
  const W = 420, Hh = 300, cx = W / 2, cy = Hh / 2, rx = 140, ry = 108;
  const n = cs.length;
  let lines = "", nodes = "";
  cs.forEach((c, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n + (n === 2 ? Math.PI / 2 : 0);
    const x = cx + rx * Math.cos(ang), y = cy + ry * Math.sin(ang);
    const o = P.get(c.id), col = `var(${REL[c.t].col})`;
    const anchor = Math.abs(Math.cos(ang)) < 0.3 ? "middle" : (Math.cos(ang) > 0 ? "start" : "end");
    const lx = x + (anchor === "start" ? 12 : anchor === "end" ? -12 : 0), ly = y + (anchor === "middle" ? (Math.sin(ang) > 0 ? 24 : -15) : 4);
    lines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="2" ${c.t === "rivals" ? 'stroke-dasharray="5 4"' : ""}/>`;
    nodes += `<a href="#p-${o.id}"><circle cx="${x}" cy="${y}" r="8" fill="var(--f-${o.f})" stroke="var(--surface)" stroke-width="2"/><text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="13" font-weight="600" fill="var(--ink)">${esc(short(o))}</text><text x="${lx}" y="${ly + 14}" text-anchor="${anchor}" font-size="10.5" fill="${col}" letter-spacing=".04em">${esc(c.label.toUpperCase())}</text></a>`;
  });
  const center = `<circle cx="${cx}" cy="${cy}" r="30" fill="var(--f-${p.f})"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--surface)">${esc(short(p).length > 10 ? short(p).slice(0, 9) + "…" : short(p))}</text>`;
  return `<div class="graph"><svg viewBox="-60 -10 ${W + 120} ${Hh + 26}" role="img" aria-label="Connections of ${esc(p.n)}">${lines}${nodes}${center}</svg></div>`;
}
function connList(p){
  const cs = connOf(p.id);
  if (!cs.length) return `<p class="empty">No documented personal links in this book yet. See who lived alongside them below.</p>`;
  return `<div class="conn">${cs.map(c => { const o = P.get(c.id); return `<a class="row" href="#p-${o.id}"><span class="who">${fieldDot(o.f)}${esc(o.n)} <span class="muted yr" style="font-weight:400;font-size:12px">${span(o)}</span></span><span class="rel" style="--rc:var(${REL[c.t].col})">${esc(c.label)}</span><span class="note">${esc(c.note)}${c.lab !== "verified" ? " " + labHTML(c.lab) : ""}</span></a>${whyHTML(c.why)}`; }).join("")}</div>`;
}

const NOTE = n => { const m = /^([A-G])(#|b)?(\d)$/.exec(n); const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0); return 440 * Math.pow(2, (base + (parseInt(m[3], 10) + 1) * 12 - 69) / 12); };
const MEL = {
  "fifth": {u:0.15, label:"Play the opening motif", n:"G4 1,G4 1,G4 1,Eb4 7,r 2,F4 1,F4 1,F4 1,D4 9"},
  "fur-elise": {u:0.17, label:"Play the opening", n:"E5 1,D#5 1,E5 1,D#5 1,E5 1,B4 1,D5 1,C5 1,A4 2,r 1,C4 1,E4 1,A4 1,B4 2,r 1,E4 1,G#4 1,B4 1,C5 2,r 1,E4 1,E5 1,D#5 1,E5 1,D#5 1,E5 1,B4 1,D5 1,C5 1,A4 2,r 1,C4 1,E4 1,A4 1,B4 2,r 1,E4 1,C5 1,B4 1,A4 5"},
  "ninth": {u:0.4, label:"Play Ode to Joy", n:"F#4 1,F#4 1,G4 1,A4 1,A4 1,G4 1,F#4 1,E4 1,D4 1,D4 1,E4 1,F#4 1,F#4 1.5,E4 .5,E4 2,F#4 1,F#4 1,G4 1,A4 1,A4 1,G4 1,F#4 1,E4 1,D4 1,D4 1,E4 1,F#4 1,E4 1.5,D4 .5,D4 2.5"}
};
let actx = null, playing = null;
function stopMusic(){ if (playing) { playing.nodes.forEach(o => { try { o.stop(); } catch(e){} }); clearTimeout(playing.t); const b = document.querySelector(`[data-play="${playing.id}"]`); if (b) b.setAttribute("aria-pressed", "false"); playing = null; } }
function playMusic(id){
  const m = MEL[id]; if (!m) return;
  const was = playing && playing.id === id; stopMusic(); if (was) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  if (actx.state === "suspended") actx.resume();
  let t = actx.currentTime + 0.05; const nodes = [];
  m.n.split(",").forEach(tok => {
    const [n, d] = tok.trim().split(" "), dur = parseFloat(d) * m.u;
    if (n !== "r") {
      const f = NOTE(n);
      [["triangle", 0.16], ["sine", 0.08]].forEach(([type, vol], k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f * (k ? 2 : 1);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0008, t + Math.max(0.12, dur * 0.98));
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05); nodes.push(o);
      });
    }
    t += dur;
  });
  const b = document.querySelector(`[data-play="${id}"]`); if (b) b.setAttribute("aria-pressed", "true");
  playing = {id, nodes, t: setTimeout(() => { playing = null; const bb = document.querySelector(`[data-play="${id}"]`); if (bb) bb.setAttribute("aria-pressed", "false"); }, (t - actx.currentTime) * 1000 + 100)};
}

const clampY = y => { y = Math.round(y); if (!Number.isFinite(y)) return 1889; if (y === 0) y = 1; return Math.max(-600, Math.min(NOW, y)); };

const TM_JUMPS = ["caesar-killed","mongol-empire","columbus-1492","globe-theatre","french-revolution","eiffel-tower","ww1","moon-landing"];
function viewTM(y){
  if (y != null) tmYear = clampY(y);
  const jumps = TM_JUMPS.map(id => E.get(id)).filter(Boolean).map(e => `<button type="button" class="chip" data-tmy="${e.y}">${fy(e.y)} · ${esc(e.n.length > 22 ? e.n.split(/[,:(]/)[0] : e.n)}</button>`).join("") + (youYear ? `<button type="button" class="chip" data-tmy="${youYear}">${youYear} · You're born</button>` : "");
  view.innerHTML = `<section class="tm-head">
    <span class="eyebrow">Time Machine</span>
    <div id="tm-top"></div>
    <div class="tm-ctl">
      <div class="line"><label class="you-in">Year <input type="number" id="tm-in" value="${tmYear}" min="-600" max="${NOW}"></label><span class="muted" style="font-size:12px">Use a minus sign for BC, like -44</span></div>
      <input type="range" id="tm-r" min="-600" max="${NOW}" step="1" value="${tmYear}" aria-label="Pick a year">
      <div class="line">${[-100,-10,-1,1,10,100].map(d => `<button type="button" class="step" data-d="${d}">${d > 0 ? "+" : "−"}${Math.abs(d)}</button>`).join("")}<button type="button" class="step" data-rand>Surprise me</button></div>
      <div class="chips">${jumps}</div>
    </div></section>
    <div id="tm-out" class="stack" style="gap:40px"></div>`;
  drawTM();
}
function drawTM(){
  const out = document.getElementById("tm-out"); if (!out) return;
  const y = tmYear, ay = astro(y);
  store.set("ctm-tm", y);
  try { history.replaceState(null, "", "#tm-" + y); } catch(e){}
  const inp = document.getElementById("tm-in"), rg = document.getElementById("tm-r");
  if (inp && document.activeElement !== inp) inp.value = y; if (rg) rg.value = y;
  const ago = astro(NOW) - ay, g = Math.round(ago / GEN);
  const alive = aliveAt(y).sort((a, b) => astro(a.b) - astro(b.b));
  const you = youYear ? (y < youYear ? `<span>${plural(youYear - y, "year")} before you were born</span>` : `<span>You were ${y - youYear}</span>`) : "";
  document.getElementById("tm-top").innerHTML = `<div class="tm-year">${y < 0 ? -y + "<small>BC</small>" : y}</div>
    <div class="tm-sub"><a class="btn" href="#walk-${y}">Walk into ${fy(y)}</a><span>${ago === 0 ? "This year" : plural(ago, "year") + " ago"}</span>${ago >= GEN ? `<span>about ${plural(g, "generation")} back</span>` : ""}<span>${plural(alive.length, "person")} in this book alive</span>${you}</div>`;
  const ev = H.events;
  const under = ev.filter(e => e.e && astro(e.y) <= ay && ay <= astro(e.e)).sort((a, b) => astro(a.y) - astro(b.y));
  const now = ev.filter(e => !e.e && e.y === y);

function rng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const QGEN = {
  first(r){
    for (let i = 0; i < 300; i++) {
      const a = pick(sureP, r), b = pick(sureP, r), gap = Math.abs(astro(a.b) - astro(b.b));

      return {q:`Who was born first: ${a.n} or ${b.n}?`, o:[a.n, b.n], a: first === a ? 0 : 1, ids:[a.id, b.id],
        why:`${esc(first.n)} was born in <span class="yr">${fy(first.b)}</span>, ${plural(gap, "year")} before ${esc((first === a ? b : a).n)} (<span class="yr">${fy((first === a ? b : a).b)}</span>).`, extra: gensHTML(a, b) + duoChart(a, b)};

  overlap(r){
    for (let i = 0; i < 400; i++) {

      const c = connBetween(a.id, b.id);

      if (o.len >= 0) why = `Yes. Both were alive from <span class="yr">${fy(unastro(o.s))}</span> to <span class="yr">${fy(unastro(o.e))}</span>, ${plural(o.len, "year")} in all.${c ? ` And they really knew each other: ${esc(c.note)}` : ""}`;

  age(r){

/* ---------- Six Degrees ---------- */
function findPath(a, b){
  const prev = new Map([[a, null]]), q = [a];
  while (q.length) { const x = q.shift(); if (x === b) break; for (const c of connOf(x)) if (!prev.has(c.id)) { prev.set(c.id, {from:x, c}); q.push(c.id); } }
  if (!prev.has(b)) return null;
  const path = []; let cur = b; while (cur !== a) { const s = prev.get(cur); path.unshift({from:s.from, to:cur, c:s.c}); cur = s.from; }
  return path;
}
let degA = store.get("ctm-dA") || "van-gogh", degB = store.get("ctm-dB") || "einstein";

  <div class="row-btns"><button type="button" class="btn ghost sm" id="dRand">Find me a long chain</button></div><div id="dOut"></div></div></section>`;

}

}
function longPair(){
  const ids = H.people.filter(p => connOf(p.id).length).map(p => p.id);
  let best = null;
  for (let i = 0; i < 60; i++) { const a = pick(ids, Math.random), b = pick(ids, Math.random); if (a === b) continue; const p = findPath(a, b); if (p && p.length >= 3 && (!best || p.length > best.p.length)) best = {a, b, p}; if (best && best.p.length >= 5) break; }
  return best;

/* ---------- Timeline race ---------- */
let race = null, raceTimer = null;
const raceBest = () => parseFloat(store.get("ctm-race")) || null;
function newRace(){
  for (let t = 0; t < 200; t++) {
    const anchor = pick(sureP, Math.random);
    const pool = shuffle(sureP.filter(p => Math.abs(astro(p.b) - astro(anchor.b)) <= 180), Math.random);
    const chosen = [];
    for (const p of pool) { if (chosen.every(c => Math.abs(astro(c.b) - astro(p.b)) >= 6)) chosen.push(p); if (chosen.length === 5) break; }
    if (chosen.length === 5) return {items: shuffle(chosen, Math.random), order: chosen.slice().sort((a, b) => astro(a.b) - astro(b.b)), next: 0, start: null, pen: 0, end: null};
  }
}

const PG = (pts, c) => `<polygon points="${pts}"${c ? ` class="${c}"` : ""}/>`;
const PA = (d, c) => `<path d="${d}"${c ? ` class="${c}"` : ""}/>`;
const CI = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}"${c ? ` class="${c}"` : ""}/>`;
const dome = (cx, by, rw, rh) => `M${cx - rw},${by} Q${cx - rw},${by - rh * 1.25} ${cx},${by - rh} Q${cx + rw},${by - rh * 1.25} ${cx + rw},${by} Z`;
const onion = (cx, by, r) => `M${cx - r},${by} C${cx - r * 1.5},${by - r * 1.1} ${cx - r * .2},${by - r * 1.6} ${cx},${by - r * 2.4} C${cx + r * .2},${by - r * 1.6} ${cx + r * 1.5},${by - r * 1.1} ${cx + r},${by} Z`;
const spire = (cx, by, w, h) => PG(`${cx - w / 2},${by} ${cx},${by - h} ${cx + w / 2},${by}`);
const winRow = (x, y, n, gap, w, h, lit) => { let s = ""; for (let i = 0; i < n; i++) s += R(x + i * gap, y, w, h, lit ? "w" : "wo"); return s; };

/* ordinary houses by region and era */
function houses(x0, x1, y, r, reg){
  const era = wkEra(y); let s = "", x = x0;
  const tall = [70, 90, 105, 130, 150, 170][era];
  while (x < x1 - 40) {
    const w = 56 + Math.floor(r() * 64), h = Math.round(tall * (.55 + r() * .55)), c = r() < .5 ? "" : "m2", lit = () => r() < .6;
    const X = Math.min(w, x1 - x); let b = "";
    if (reg === "steppe" && y < 1950) { b = PA(`M${x},${GY} L${x},${GY - 26} Q${x + X / 2},${GY - 56} ${x + X},${GY - 26} L${x + X},${GY} Z`, c) + R(x + X / 2 - 6, GY - 20, 12, 20, "w"); x += X + 14; s += b; continue; }

view.addEventListener("keydown", ev => { const l = ev.target.closest && ev.target.closest("[data-lamp]"); if (l && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openHall(l.dataset.lamp); } });
view.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "mythT") { showMyths = t.checked; store.set("ctm-myths", showMyths ? "1" : "0"); viewEvents(); return; }
  if (t.id === "dA" || t.id === "dB") { if (t.id === "dA") degA = t.value; else degB = t.value; drawDegrees(); return; }
  if (t.id === "wA" || t.id === "wB") { if (t.id === "wA") wiA = t.value; else wiB = t.value; drawWhatIfFacts(); return; }
  if (t.id === "tm-in") { const v = parseInt(t.value, 10); if (Number.isFinite(v)) { tmYear = clampY(v); drawTM(); } }
  if (t.id === "wk-in") { const v = parseInt(t.value, 10); if (Number.isFinite(v)) { wkYear = clampY(v); wkFocus = null; drawWalk(); } }
});
view.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "tm-r") { tmYear = clampY(parseInt(t.value, 10)); drawTM(); return; }
  if (t.id === "wk-r") { wkYear = clampY(parseInt(t.value, 10)); wkFocus = null; clearTimeout(wkT); wkT = setTimeout(drawWalk, 60); return; }
  if (t.id === "you2") {
    const v = parseInt(t.value, 10), ok = v > 1900 && v <= NOW;
    if (t.value && !ok) return;
    youYear = ok ? v : null; store.set("ctm-you", youYear); drawYou();
  }
});
let wkT = null, wkDragged = false, wkDrag = null;
view.addEventListener("pointerdown", ev => { const sc = ev.target.closest(".wk-scroll"); if (!sc || ev.pointerType !== "mouse") return; wkDrag = {x: ev.clientX, s: sc.scrollLeft, sc}; wkDragged = false; });
window.addEventListener("pointermove", ev => { if (!wkDrag) return; const dx = ev.clientX - wkDrag.x; if (Math.abs(dx) > 5) { wkDragged = true; wkDrag.sc.classList.add("drag"); } if (wkDragged) wkDrag.sc.scrollLeft = wkDrag.s - dx; });
window.addEventListener("pointerup", () => { if (!wkDrag) return; wkDrag.sc.classList.remove("drag"); wkDrag = null; setTimeout(() => { wkDragged = false; }, 0); });
view.addEventListener("keydown", ev => {
  const f = ev.target.closest && ev.target.closest(".wk-fig"); if (f && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); selectWalk(f.dataset.wp); return; }
  if (ev.target.id === "wkS" && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) { ev.preventDefault(); wkTo(ev.target, ev.target.scrollLeft + (ev.key === "ArrowRight" ? 1 : -1) * 240); }
});
view.addEventListener("submit", ev => {
  if (ev.target.id !== "talkForm") return;
  ev.preventDefault();
  const i = document.getElementById("talkIn"), v = i.value; i.value = "";
  sendTalk(location.hash.slice(6), v);
});

/* home interactions (delegated) */
view.addEventListener("change", ev => {
  if (ev.target.id === "cmpA" || ev.target.id === "cmpB") {
    if (ev.target.id === "cmpA") cmpA = ev.target.value; else cmpB = ev.target.value;
    store.set("ctm-a", cmpA); store.set("ctm-b", cmpB);
    document.getElementById("verdict").innerHTML = verdictHTML();
  }
});
view.addEventListener("click", ev => {
  if (ev.target.closest("#swap")) {
    [cmpA, cmpB] = [cmpB, cmpA]; store.set("ctm-a", cmpA); store.set("ctm-b", cmpB);
    document.getElementById("cmpA").value = cmpA; document.getElementById("cmpB").value = cmpB;
    document.getElementById("verdict").innerHTML = verdictHTML(); return;
  }
  if (ev.target.closest("[data-shuffle]")) { document.getElementById("rand").innerHTML = randHTML(); return; }
  const er = ev.target.closest("[data-era]");
  if (er) {
    era = er.dataset.era; store.set("ctm-era", era);
    document.querySelectorAll("#eras .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.era === era));
    mountMain();
    return;
  }
  const fb = ev.target.closest("[data-field]");
  if (fb) {
    const f = fb.dataset.field;
    if (fieldOn.size === Object.keys(F).length) { fieldOn.clear(); fieldOn.add(f); }       // first tap: show only this field
    else if (fieldOn.has(f)) { fieldOn.delete(f); if (!fieldOn.size) Object.keys(F).forEach(k => fieldOn.add(k)); }
    else fieldOn.add(f);
    document.querySelectorAll("#fields .chip").forEach(c => c.setAttribute("aria-pressed", fieldOn.has(c.dataset.field)));
    mainTL && mainTL.render(true);
  }
});
view.addEventListener("input", ev => {
  if (ev.target.id !== "you") return;
  const v = parseInt(ev.target.value, 10);
  const ok = v > 1900 && v <= NOW;
  if (ev.target.value && !ok) return;
  youYear = ok ? v : null; store.set("ctm-you", youYear);
  mainTL && mainTL.render(true);
  const a = document.getElementById("cmpA"), b = document.getElementById("cmpB");
  if (!youYear) { if (cmpA === "you") cmpA = "van-gogh"; if (cmpB === "you") cmpB = "beethoven"; }
  if (a) { a.innerHTML = personOptions(cmpA); b.innerHTML = personOptions(cmpB); document.getElementById("verdict").innerHTML = verdictHTML(); }
});

/* ---------- search ---------- */
const IDX = [].concat(
  H.people.map(p => ({h:"#p-" + p.id, n:p.n, s:span(p), k:p.n.toLowerCase()})),
  H.events.map(e => ({h:"#e-" + e.id, n:e.n, s:fy(e.y, e.a), k:e.n.toLowerCase()})),
  Object.keys(C).map(c => ({h:"#c-" + c, n:C[c].n, s:"Place", k:C[c].n.toLowerCase()})),
  [...M.values()].map(m => ({h:"#e-" + m.id, n:m.n, s:"Myth", k:m.n.toLowerCase()})),
  H.works.map(w => ({h:"#p-" + w.by, n:w.n, s:fy(w.y, w.a), k:w.n.toLowerCase()}))
);
/* chapter search: section headings, keywords and the full text, so "the ear" lands on Van Gogh › Myths and facts */
const norm = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const CHX = [];
Object.keys(CH).forEach(id => {
  const p = P.get(id); if (!p) return;
  const nm = short(p);
  CH[id].sections.forEach(s => CHX.push({h:`#p-${id}@${s.k}`, n:`${nm} › ${s.h}`, s:"Chapter", k:norm(s.h), body:secText(s)}));
  (CH[id].kw || []).forEach(w0 => {
    const [w, to] = w0.split("@"), nw = norm(w), re = new RegExp("\\b" + reEsc(nw) + "\\b", "g");
    let s = CH[id].sections[0], best = 0;
    CH[id].sections.forEach(x => { const n = (norm(secText(x)).match(re) || []).length; if (n > best) { best = n; s = x; } });
    if (to) s = CH[id].sections.find(x => x.k === to) || s;
    CHX.push({h:`#p-${id}@${s.k}`, n:`${nm} › ${s.h}`, s:w, k:nw, kw:true});
  });
});
const q = document.getElementById("q"), res = document.getElementById("results");
let hits = [], sel = 0;
function snip(body, s){
  const nb = norm(body), m = new RegExp("\\b" + reEsc(s) + (s.length < 5 ? "\\b" : "")).exec(nb); if (!m) return "";
  const i = m.index, a = Math.max(0, i - 50), b = Math.min(body.length, i + s.length + 60);
  return (a ? "…" : "") + esc(body.slice(a, i)) + "<mark>" + esc(body.slice(i, i + s.length)) + "</mark>" + esc(body.slice(i + s.length, b)) + (b < body.length ? "…" : "");
}
function showRes(){
  const raw = q.value.trim(), s = norm(raw).replace(/^the\s+/, "") || norm(raw);
  if (!s) { res.hidden = true; return; }
  const base = IDX.filter(x => norm(x.k).includes(s)).sort((a, b) => (norm(b.k).startsWith(s) || norm(b.k).includes(" " + s)) - (norm(a.k).startsWith(s) || norm(a.k).includes(" " + s)));
  const seen = new Set(), chap = [];
  const add = (x, sn) => { if (seen.has(x.h)) return; seen.add(x.h); chap.push(Object.assign({}, x, {sn})); };
  CHX.filter(x => x.kw && (x.k === s || x.k.startsWith(s))).forEach(x => add(x, ""));
  CHX.filter(x => !x.kw && (s.length < 5 ? new RegExp("^" + reEsc(s) + "\\b").test(x.k) : x.k.startsWith(s))).forEach(x => add(x, ""));
  if (s.length >= 2) CHX.filter(x => !x.kw && x.body).forEach(x => { const sn = snip(x.body, s); if (sn) add(x, sn); });
  const top = chap.filter(x => !x.sn), body = chap.filter(x => x.sn);
  hits = top.concat(base.slice(0, Math.max(3, 8 - chap.length)), body).slice(0, 8);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((x, i) => `<a href="${x.h}" class="${i === sel ? "on" : ""}${x.sn ? " has-snip" : ""}"><span>${esc(x.n)}</span><small class="yr">${esc(x.s)}</small>${x.sn ? `<small class="snip">${x.sn}</small>` : ""}</a>`).join("") : `<div class="none">Nothing found for "${esc(q.value)}"</div>`;
  res.hidden = false;
}
q.addEventListener("input", showRes);
q.addEventListener("keydown", e => {
  if (res.hidden) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(1, hits.length); res.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === sel)); }
  if (e.key === "Enter" && hits[sel]) { location.hash = hits[sel].h; q.value = ""; res.hidden = true; q.blur(); }
  if (e.key === "Escape") { res.hidden = true; }
});
res.addEventListener("click", e => { if (e.target.closest("a")) { q.value = ""; res.hidden = true; } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });

route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const h = location.hash; if (h === "#timeline") mainTL && mainTL.render(true); sizeLamps(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (mainTL && document.getElementById("tl-main")) mainTL.render(true); sizeLamps(); }, 200); });
/* tell the app the page is ready, so the opening animation can hand over to it */
requestAnimationFrame(() => { try { window.webkit.messageHandlers.ready.postMessage("1"); } catch(e){} });
})();
</script>
